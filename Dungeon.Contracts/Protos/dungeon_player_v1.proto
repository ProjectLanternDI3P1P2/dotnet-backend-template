syntax = "proto3";

package dungeon.v1;

option csharp_namespace = "Dungeon.Contracts.V1";

// Contract owned by the Dungeon microservice. Field numbers are permanent:
// do not reuse a deleted number; reserve it instead.
service DungeonPlayerService {
  rpc GetPlayer (GetPlayerRequest) returns (GetPlayerResponse);
}

message GetPlayerRequest {
  // RFC 4122 textual UUID of the player.
  string player_id = 1;
}

message GetPlayerResponse {
  string id = 1;
  string name = 2;
  int32 health = 3;
  int32 max_health = 4;
  int32 attack = 5;
}
