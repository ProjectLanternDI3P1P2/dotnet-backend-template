name: Release Please

# Keeps a standing "chore(main): release X.Y.Z" pull request on main, carrying the
# CHANGELOG entry and the bumped version. Merging it tags the release.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # BOT_TOKEN, not GITHUB_TOKEN: a pull request opened by the latter triggers no
          # workflow, so the release pull request would never get a CI run.
          token: ${{ secrets.BOT_TOKEN }}
          # Explicit: the action targets the default branch otherwise, and here that is dev.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
